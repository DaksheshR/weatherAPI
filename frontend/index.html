<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search real-time weather conditions for any city worldwide.">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city">
    <button onclick="getWeather()">Search</button>

    <div id="loader">Please wait for a minute and refresh, backend takes about a min to wake up</div>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
